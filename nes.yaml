# Retro-Refiner configuration

sources:
  - "https://myrient.erista.me/files/No-Intro/Nintendo%20-%20Nintendo%20Entertainment%20System%20%28Headered%29/"
  - "https://myrient.erista.me/files/T-En%20Collection/Nintendo%20-%20Famicom%20%5BT-En%5D%20Collection/"
destination: "C:\Users\atkin\Downloads\test"
systems: null

# ROM selection
selection:
  english_only: true
  exclude_protos: false
  include_betas: false
  include_unlicensed: false
  region_priority:
    - USA
    - World
    - Europe
    - Australia
    - England
    - Spain
    - France
    - Germany
    - Italy
    - Netherlands
    - Sweden
    - Asia
    - Japan
    - Korea
    - China
    - Taiwan
    - Brazil
  keep_regions: null
  include_patterns:
  exclude_patterns:
  all_roms: false
  best_version: true
  verbose: false
  genres: null
  year_from: null
  year_to: null

# Budget / top-N filtering
budget:
  top: null
  limit: null
  size: null
  include_unrated: false
  prefer_exclusives: null

# Network options
network:
  parallel: 4
  connections: null
  auto_tune: true
  scan_workers: 16
  resume_downloads: false

# Output and transfer
output:
  local_file_action: copy
  flat: false
  playlists: false
  gamelist: null
  retroarch_playlists: null
  prefer_source: null
  print_roms: false
  validate_destination: false
  clean_destination: false
  crc_validation: false

# Advanced options
advanced:
  no_verify: false
  no_cache: false
  no_dat: false
  no_chd: false
  no_adult: false
  mame_version: null
  recursive: false
  max_depth: 3
  cache_dir: null
  dat_dir: null
  log_dir: null
  tp_include_platforms: null
  tp_exclude_platforms: null
  tp_all_versions: false
  ratings_source: combined

# Theme
theme:
  mode: midnight-terminal
  accent: "#e94560"

# Authentication
auth:
  ia_access_key: null
  ia_secret_key: null
  igdb_client_id: null
  igdb_client_secret: null

# Deduplication
deduplication:
  priority: null
  pc_lists:
  delete: false

# Window geometry
window:
  x: 1017
  y: 275
  width: 1594
  height: 1102

